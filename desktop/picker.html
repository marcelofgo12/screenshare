<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Escolha o que compartilhar</title>
<style>
  :root {
    --surface: #161922;
    --surface-2: #1e222d;
    --border: #2a2f3d;
    --text: #eef0f4;
    --text-muted: #9aa1b0;
    --accent: #5b7cff;
    --danger: #ef4b4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 15px;
  }
  #grid {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .source {
    background: var(--surface-2);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s ease;
  }
  .source:hover {
    border-color: var(--accent);
  }
  .source img {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
    background: #000;
    display: block;
  }
  .source span {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
  }
  button {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>Escolha a tela ou janela para compartilhar</header>
  <div id="grid"></div>
  <footer>
    <button id="btn-cancel">Cancelar</button>
  </footer>

  <script>
    const grid = document.getElementById('grid');

    window.pickerAPI.getSources().then((sources) => {
      sources.forEach((s) => {
        const div = document.createElement('div');
        div.className = 'source';
        div.innerHTML = `<img src="${s.thumbnail}" /><span></span>`;
        div.querySelector('span').textContent = s.name;
        div.onclick = () => window.pickerAPI.select(s.id);
        grid.appendChild(div);
      });
    });

    document.getElementById('btn-cancel').onclick = () => window.pickerAPI.cancel();
  </script>
</body>
</html>
