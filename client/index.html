<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compartilhamento de Tela</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="home" class="view">
      <h1>Compartilhamento de Tela</h1>
      <button id="btn-host">Compartilhar minha tela</button>
      <button id="btn-join">Entrar com código</button>
    </div>

    <div id="host-view" class="view hidden">
      <h2>Compartilhando</h2>
      <input id="custom-code-input" placeholder="Código personalizado (opcional)" maxlength="12" autocapitalize="characters" />
      <button id="btn-start-share">Iniciar compartilhamento</button>
      <p class="code-box">Código da sala: <strong id="code-display">------</strong></p>
      <video id="local-video" autoplay muted playsinline></video>
      <p class="viewer-count">Assistindo: <strong id="viewer-count">0</strong></p>
      <ul id="viewer-list" class="viewer-list"></ul>
    </div>

    <div id="viewer-view" class="view hidden">
      <h2>Entrar em uma sala</h2>
      <div class="join-row">
        <input id="name-input" placeholder="Seu nome" maxlength="20" />
        <input id="code-input" placeholder="Código da sala" maxlength="6" autocapitalize="characters" />
        <button id="btn-connect">Conectar</button>
      </div>
      <div class="video-wrap">
        <video id="remote-video" autoplay playsinline></video>
        <button id="btn-fullscreen" class="fullscreen-btn hidden">⛶ Tela cheia</button>
      </div>
    </div>

    <p id="status"></p>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
